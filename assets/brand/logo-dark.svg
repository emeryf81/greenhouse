<svg xmlns="http://www.w3.org/2000/svg" width="780" height="200" viewBox="0 0 780 200" role="img" aria-label="Hortulus - garden manager for Home Assistant">
  <title>Hortulus</title>
  <g transform="translate(20 20) scale(2.5)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A9C4B"/>
      <stop offset="1" stop-color="#2F5D2A"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- marigold sun: the season -->
  <circle cx="47.5" cy="16.5" r="4.2" fill="#E8A33D"/>
  <!-- garden arch / greenhouse: the "hortus" -->
  <path d="M15 49V31a17 17 0 0 1 34 0v18" fill="none" stroke="#F3F8EF" stroke-width="3.4" stroke-linecap="round"/>
  <!-- seedling -->
  <path d="M32 49V33.5" stroke="#FBEFD9" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 39c-7.5 0-11.5-4.8-11.5-10.6 6.4-.2 11.5 3.4 11.5 10.6z" fill="#9CC58A"/>
  <path d="M32 34.5c0-7.6 4.6-12.4 12-12.6.2 7.4-4.6 12.6-12 12.6z" fill="#E4F0DC"/>
  <!-- planted rows: the plan -->
  <path d="M12 49.5h40" stroke="#C4A587" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M19 55h26" stroke="#A07B5A" stroke-width="3" stroke-linecap="round" opacity=".9"/>
</g>
  <text x="200" y="112" font-family="Fraunces, 'Bitstream Charter', Charter, Georgia, 'DejaVu Serif', serif" font-size="88" font-weight="700" letter-spacing="-1" fill="#F3F8EF">Hortulus</text>
  <text x="204" y="152" font-family="Inter, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="22" font-weight="500" letter-spacing="2.2" fill="#C4A587">GARDEN MANAGER · MOESTUINPLANNER</text>
</svg>
