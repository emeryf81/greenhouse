[project]
name = "hortulus"
version = "1.0.0"
description = "Hortulus - vegetable garden planning and care for Home Assistant"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0917", "RUF012", "PLW2901", "UP047", "SIM105", "RUF005", "PLR0913", "PLR0915", "PLR0912", "PLR0911", "PLR2004", "PLC0415", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
