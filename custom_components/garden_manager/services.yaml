run_irrigation_plan:
  fields:
    dry_run:
      default: false
      selector:
        boolean:
    beds:
      example: "Bed 1"
      selector:
        text:
          multiple: true
    amount_mm:
      selector:
        number: {min: 0.5, max: 50, step: 0.5, unit_of_measurement: mm}

stop_irrigation:

set_shading_mode:
  fields:
    zone:
      required: true
      example: "Greenhouse"
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          options: [auto, "on", "off"]

autofill_plan:
  fields:
    season:
      selector:
        number: {min: 2000, max: 2200, mode: box}
    beds:
      selector:
        text:
          multiple: true
    replace:
      default: false
      selector:
        boolean:
    apply:
      default: false
      selector:
        boolean:
    household_size:
      selector:
        number: {min: 1, max: 20, mode: box}
    hours_per_week:
      selector:
        number: {min: 0, max: 80, step: 0.5, unit_of_measurement: h}
    water_liters_per_week:
      selector:
        number: {min: 0, max: 100000, mode: box, unit_of_measurement: L}
    compost_kg:
      selector:
        number: {min: 0, max: 100000, mode: box, unit_of_measurement: kg}
    goals:
      selector:
        select:
          multiple: true
          options: [fresh, storage, herbs, pollinators, winter, perennials, easy]
    wanted:
      selector:
        text:
          multiple: true
    excluded:
      selector:
        text:
          multiple: true
    max_crops:
      default: 16
      selector:
        number: {min: 1, max: 60, mode: box}

export_pdf:
  fields:
    document:
      default: garden
      selector:
        select:
          options: [garden, zone, beds, tasks, season, year, blank, plants, book]
    page:
      default: a4
      selector:
        select:
          options: [a4, a3, a5, letter, remarkable]
    landscape:
      default: false
      selector:
        boolean:
    color_mode:
      default: color
      selector:
        select:
          options: [color, eink, grayscale]
    season:
      selector:
        number: {min: 2000, max: 2200, mode: box}
    zone_id:
      selector:
        text:
    bed_ids:
      selector:
        text:
          multiple: true
    days:
      default: 28
      selector:
        number: {min: 1, max: 120}
    notes:
      default: true
      selector:
        boolean:
    grid:
      default: true
      selector:
        boolean:
    title:
      selector:
        text:

