blueprint:
  name: Hortulus - frost warning on a lamp
  description: >-
    When Hortulus warns for frost, a lamp of your choice flashes blue a few
    times and then returns to how it was (and optionally a message goes to
    your phone), so nobody forgets the fleece over the young plants.
  domain: automation
  source_url: https://github.com/emeryf81/hortulus/blob/main/blueprints/automation/hortulus/frost_flash_light.yaml
  input:
    lamp:
      name: Lamps
      description: One or more lights; they flash and then return to how they were.
      selector:
        entity:
          domain: light
          multiple: true
    flashes:
      name: Number of flashes
      default: 3
      selector:
        number: {min: 1, max: 10, step: 1}
    color:
      name: Colour
      default: [0, 120, 255]
      selector:
        color_rgb:
    notify_service:
      name: Notify service (optional)
      description: For example notify.mobile_app_phone. Leave empty for the lamp only.
      default: ""
      selector:
        text:
mode: single
variables:
  notify_service: !input notify_service
  lamps: !input lamp
  # one snapshot per automation, so two frost lamps never restore each other's lights
  snapshot: "hortulus_frost_{{ this.entity_id | replace('automation.', '') }}"
trigger:
  - platform: event
    event_type: garden_manager_frost_warning
action:
  - service: scene.create  # remember on/off, brightness and colour
    data:
      scene_id: "{{ snapshot }}"
      snapshot_entities: "{{ lamps }}"
  - repeat:
      count: !input flashes
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ lamps }}"
          data:
            rgb_color: !input color
            brightness_pct: 100
        - delay: {seconds: 1}
        - service: light.turn_off
          target:
            entity_id: "{{ lamps }}"
        - delay: {seconds: 1}
  - service: scene.turn_on
    target:
      entity_id: "scene.{{ snapshot }}"
  - if:
      - condition: template
        value_template: "{{ notify_service | length > 0 }}"
    then:
      - service: "{{ notify_service }}"
        data:
          title: Hortulus
          message: >-
            Frost expected{% if trigger.event.data.temp is defined %} ({{ trigger.event.data.temp }} °C){% endif %}:
            cover the tender plants.
